<!DOCTYPE html>
<html lang="tr">
<head>

<link rel="stylesheet" href="style.css">

<style>
#siteFrame{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
    z-index:1;
}

#siteMusic{
    display:none;
}

            (Küçük harflerle yaz.)

            id="password"
            type="password"
            placeholder="Şifre">

        <button onclick="login()">
            Giriş Yap
        </button>

        <p id="error"></p>

    </div>

</div>


<!-- MÜZİK -->

<audio id="siteMusic">
    <source src="ses/sarki.mp3" type="audio/mpeg">
</audio>


<!-- SİTENİN SAYFALARI -->

<iframe id="siteFrame"></iframe>
