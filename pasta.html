<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>İYİ Kİ DOĞDUN PRENSESİM ❤️</title>

    <link
        rel="stylesheet"
        href="pasta.css"
    >

</head>


<body>


    <!-- =========================
         KAPATMA BUTONU
    ========================== -->

    <button
        class="closeButton"
        onclick="goHome()"
        aria-label="Ana sayfaya dön"
    >
        ×
    </button>



    <!-- =========================
         PASTA SAYFASI
    ========================== -->

    <main class="cakePage">


        <!-- ÜST TALİMAT -->

        <div
            class="instruction"
            id="instruction"
        >

            Pastanın üzerine
            <strong>3 kez tıkla</strong>
            🎂

        </div>



        <!-- TIKLAMA SAYACI -->

        <div
            class="clickCounter"
            id="clickCounter"
        >
            0 / 3
        </div>



        <!-- =========================
             PASTA
        ========================== -->

        <div
            class="cakeArea"
            id="cakeArea"
        >


            <!-- IŞIK EFEKTİ -->

            <div class="cakeGlow"></div>



            <!-- PASTA FOTOĞRAFI -->

            <img
                src="img/pasta.jpg"
                class="cakeImage"
                alt="Aynur için doğum günü pastası"
            >



            <!-- =========================
                 MUMlar
            ========================== -->

            <div class="candles">


                <div class="candle candle1">

                    <span class="flame"></span>

                </div>


                <div class="candle candle2">

                    <span class="flame"></span>

                </div>


                <div class="candle candle3">

                    <span class="flame"></span>

                </div>


                <div class="candle candle4">

                    <span class="flame"></span>

                </div>


                <div class="candle candle5">

                    <span class="flame"></span>

                </div>


            </div>



            <!-- =========================
                 PASTA VOLKANI / MAYTAB
            ========================== -->

            <div class="sparkler">


                <div class="sparklerCore"></div>


                <div class="sparklerSpark s1"></div>

                <div class="sparklerSpark s2"></div>

                <div class="sparklerSpark s3"></div>

                <div class="sparklerSpark s4"></div>

                <div class="sparklerSpark s5"></div>

                <div class="sparklerSpark s6"></div>


            </div>



            <!-- =========================
                 DOĞUM GÜNÜ YAZISI
            ========================== -->

            <div
                class="birthdayText"
                id="birthdayText"
            >

                👑
                <br>

                İYİ DOĞDUN PRENSESİM

                <br>

                ❤️

            </div>


        </div>


    </main>



    <!-- =========================
         KONFETİ
    ========================== -->

    <div
        class="confettiLayer"
        id="confettiLayer"
    >
    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="pasta.js"></script>


</body>

</html>
