<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🗺️ Türkiye Haritamız ❤️</title>

    <link rel="stylesheet" href="turkiye.css">

</head>

<body>

    <!-- Üst Menü -->

    <header class="topBar">

        <button class="backButton"
                onclick="location.href='index.html'">

            ← Ana Sayfa

        </button>

        <h1>🗺️ Türkiye Haritamız ❤️</h1>

    </header>


    <!-- Harita -->

    <main class="container">

        <div id="mapWrapper" class="mapWrapper">

            <object id="turkiyeMap"
                    data="turkey.svg"
                    type="image/svg+xml">
            </object>

        </div>

    </main>


    <!-- Popup -->

    <div id="cityPopup" class="popup">

        <div class="popupCard">

            <button id="closePopup"
                    class="closeButton">

                ✕

            </button>

            <h2 id="popupTitle"></h2>

            <p id="popupDate"></p>

            <p id="popupText"></p>

            <div id="popupGallery"
                 class="popupGallery">

            </div>

        </div>

    </div>


    <!-- Panzoom -->

    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>

    <!-- Javascript -->

    <script src="turkiye.js"></script>

</body>

</html>
