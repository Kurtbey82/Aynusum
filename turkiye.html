<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkiye Haritamız ❤️</title>

    <link rel="stylesheet" href="turkiye.css">
</head>

<body>

<div class="topBar">

    <button class="backButton" onclick="location.href='index.html'">
        ← Ana Sayfa
    </button>
<h1>🗺️ Türkiye Haritamız</h1>
</div>
<div class="container">

    <div class="mapWrapper">
        <object
            id="turkiyeMap"
            data="turkey.svg"
            type="image/svg+xml">
        </object>
    </div>

    <div class="heart hatay" onclick="openCity('hatay')">
        ❤️
        <span>Hatay</span>
    </div>

    <div class="heart mersin" onclick="openCity('mersin')">
        ❤️
        <span>Mersin</span>
    </div>

    <div class="heart isparta" onclick="openCity('isparta')">
        ❤️
        <span>Isparta</span>
    </div>
<div id="cityPopup" class="popup">

    <div class="popupCard">

        <h2 id="popupTitle"></h2>

        <p id="popupDate"></p>

        <p id="popupText"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>
<script src="turkiye.js"></script>
</body>
</html>
