<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title> 📍Kalbimizin Durakları</title>

<link rel="stylesheet" href="turkiye.css">

</head>

<body>

<header class="topBar">

    <button class="backButton" onclick="location.href='index.html'">
    ← <span>Ana Sayfa</span>
    </button>
    <h1>📍Kalbimizin Durakları</h1>

</header>


<main class="container">

    <div class="mapWrapper">

        <object
            id="turkiyeMap"
            data="turkey.svg"
            type="image/svg+xml">
        </object>

    </div>

</main>


<!-- Popup -->

<div id="cityPopup" class="popup">

    <div class="popupCard">

        <button id="closePopup"
                class="closeButton">

            ✕

        </button>

        <h2 id="popupTitle"></h2>

        <p class="popupDate"
           id="popupDate"></p>

        <p class="popupText"
           id="popupText"></p>


        <!-- Spotify -->

        <div id="spotifyCard"
             class="spotifyCard">

            <img id="spotifyCover"
                 src=""
                 alt="Kapak">

            <div class="spotifyInfo">

                <h3 id="songTitle"></h3>

                <p id="songArtist"></p>

            </div>

        </div>


        <!-- Fotoğraflar -->

        <div id="popupGallery"
             class="gallery">

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>

<script src="turkiye.js"></script>

</body>

</html>
<script>
history.pushState(null, "", location.href);

window.addEventListener("popstate", function () {
    window.location.replace("home.html");
});
</script>
